<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Unblocked Games Site</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; text-align: center; margin: 0; padding: 20px; }
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .game-card { background: #1f1f1f; border-radius: 8px; padding: 15px; cursor: pointer; transition: 0.3s; border: 1px solid #333; }
        .game-card:hover { transform: translateY(-5px); background: #2a2a2a; }
        .game-card img { width: 100%; height: 120px; border-radius: 5px; object-fit: cover; }
        iframe { width: 100%; height: 600px; border: none; background: #000; border-radius: 8px; margin-top: 20px; }
        .hidden { display: none; }
        #back-btn { background: #ff4757; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Unblocked Arcade</h1>

    <!-- Game List View -->
    <div id="home-view">
        <div class="game-grid" id="game-container"></div>
    </div>

    <!-- Active Game Play View -->
    <div id="game-view" class="hidden">
        <button id="back-btn" onclick="closeGame()">← Back to Games</button>
        <div id="frame-wrapper"></div>
    </div>

    <script>
        // Array holding your game details
        const games = [
            {
                name: "Retro Game 1",
                icon: "https://placeholder.com",
                url: "https://example.com" 
            },
            {
                name: "Retro Game 2",
                icon: "https://placeholder.com",
                url: "https://example.com"
            }
        ];

        const container = document.getElementById('game-container');

        // Populate the homepage grid
        games.forEach(game => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <img src="${game.icon}" alt="${game.name}">
                <h3>${game.name}</h3>
            `;
            card.onclick = () => launchGame(game.url);
            container.appendChild(card);
        });

        function launchGame(url) {
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            document.getElementById('frame-wrapper').innerHTML = `<iframe src="${url}"></iframe>`;
        }

        function closeGame() {
            document.getElementById('game-view').classList.add('hidden');
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('frame-wrapper').innerHTML = '';
        }
    </script>
</body>
</html>
